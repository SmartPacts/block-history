# Nginx API proxy for a local Kadena development network.
#
# It exists for CORS. Every Pact call (/local, /send, /poll) is a POST with
# `Content-Type: application/json`, which makes a browser send a preflight first; this
# proxy answers the preflight itself and replaces the node's CORS headers with one complete
# set. Two sets would arrive as `Access-Control-Allow-Origin: *, *`, which a browser rejects.
#
# Measured: a page completes a GET and a preflighted POST through this proxy and reads the
# response.

upstream service-api { server bootstrap-node:1848; }
upstream peer-api    { server bootstrap-node:1789; }

server {
    listen 80;
    server_name block-history-devnet;

    # --- CORS, applied to every route below ---
    # A devnet is a throwaway chain on the developer's own machine, so '*' is
    # the right origin here. Never copy this onto a node holding anything real.
    #
    # Drop whatever the node sent first, so exactly one set reaches the browser.
    # Without these three lines the response carries two ACAO values and every
    # call fails, however correct our own headers are.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;

    add_header Access-Control-Allow-Origin  '*' always;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Content-Type' always;
    add_header Access-Control-Max-Age       '600' always;

    # Answer the preflight here rather than forwarding it, so the reply carries the complete
    # set of headers above.
    if ($request_method = OPTIONS) { return 204; }

    location = /info         { proxy_pass http://service-api; }
    location = /health-check { proxy_pass http://service-api; }

    location ~ ^/chainweb/0.0/[0-9a-zA-Z\-\_]+/chain/[0-9]+/pact/ {
        proxy_pass http://service-api;
    }
    location ~ ^/chainweb/0.0/[0-9a-zA-Z\-\_]+/chain/[0-9]+/(header|hash|branch|payload|block) {
        proxy_pass http://service-api;
    }
    location ~ ^/chainweb/0.0/[0-9a-zA-Z\-\_]+/cut {
        proxy_pass http://service-api;
    }
    location ~ ^/chainweb/0.0/[0-9a-zA-Z\-\_]+/header/updates {
        proxy_buffering off;
        proxy_pass http://service-api;
    }
    location ~ ^/chainweb/0.0/[0-9a-zA-Z\-\_]+/mining/ {
        proxy_buffering off;
        proxy_pass http://service-api;
    }

    location / { return 404; }
}
